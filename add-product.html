<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>List an item — BidZone</title><link rel="stylesheet" href="styles/style.css"></head>
<body>
  <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">B</span><span>Bid<span>Zone</span></span></a><nav class="desktop-nav"><a href="index.html">Marketplace</a><a href="my-bids.html">My bids</a><a class="active" href="my-products.html">My products</a></nav><div class="header-actions"><a class="avatar-link" href="account.html"><img data-user-avatar src="https://ui-avatars.com/api/?name=B&background=16263f&color=fff" alt="Account"></a><button class="menu-toggle" data-menu-toggle="#mobile-nav">☰</button></div></header>
  <nav id="mobile-nav" class="mobile-nav"><a href="index.html">Marketplace</a><a href="my-bids.html">My bids</a><a href="my-products.html">My products</a><a href="account.html">Account</a><button data-logout>Sign out</button></nav>
  <main class="container page-content narrow"><a class="back-link" href="my-products.html">← Your products</a><div class="page-title"><span class="eyebrow">SHARE SOMETHING SPECIAL</span><h1 id="form-heading">List an item</h1><p id="form-intro" class="muted">Create a clear listing and let the community make the offer.</p></div><div data-setup-message class="setup-message" hidden></div><form id="product-form" class="listing-form"><div class="form-section"><h3>Listing details</h3><label>Title<input name="title" required maxlength="100" placeholder="What are you listing?"></label><label>Category<select name="category" required><option value="">Choose a category</option><option>Art & Collectibles</option><option>Fashion</option><option>Electronics</option><option>Home & Design</option><option>Sports</option><option>Other</option></select></label><label>Description<textarea name="description" rows="6" required maxlength="2000" placeholder="Tell bidders what makes this item special…"></textarea></label></div><div class="form-section"><h3>Pricing & timing</h3><div class="two-col"><label>Starting price (USD)<input name="startingPrice" type="number" min="0.01" step="0.01" required placeholder="25.00"></label><label>Auction starts<input name="startTime" type="datetime-local" required></label><label>Auction ends<input name="endTime" type="datetime-local" required></label></div></div><div class="form-section"><h3>Item photo <span class="optional">optional</span></h3><label class="file-drop"><span class="upload-icon">↑</span><strong>Choose a photo</strong><small>JPG, PNG or WEBP · max 5 MB</small><input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label></div><div data-notice hidden></div><div class="form-actions"><a class="button outline" href="my-products.html">Cancel</a><button class="button primary" type="submit">Publish auction</button></div></form></main>
  <script type="module" src="scripts/add-product.js"></script>
</body>
</html>
